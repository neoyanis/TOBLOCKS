<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 TOBLOCKS - 3D Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; }
        
        #login-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .login-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            min-width: 400px;
        }
        
        .login-box h1 { margin-bottom: 30px; font-size: 2.5em; }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        
        .login-box button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .login-box button:hover { background: #764ba2; }
        
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            min-width: 250px;
        }
        
        .shop {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            display: none;
            pointer-events: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .shop.active { display: block; }
        
        .shop-item {
            background: rgba(100, 100, 255, 0.3);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .shop-item:hover { background: rgba(100, 100, 255, 0.6); }
        
        .buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .buttons button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .buttons button:hover { background: #764ba2; }
        
        .message {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            display: none;
            pointer-events: auto;
        }
        
        .message.active { display: block; }
        
        .stat-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 5px;
            margin: 5px 0;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h1>⛩️ TOBLOCKS</h1>
            <p>Bienvenue dans un monde mystique en 3D</p>
            <input type="text" id="username" placeholder="Nom d'utilisateur" />
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Mot de passe" />
            <button onclick="login()">Commencer</button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container"></div>
    
    <!-- Game UI -->
    <div id="game-ui">
        <!-- HUD -->
        <div class="hud">
            <h3 id="player-name">Joueur</h3>
            <div>Niveau: <strong id="level">1</strong></div>
            <div>XP: <strong id="xp">0</strong></div>
            <div>Or: <strong id="gold">1000</strong></div>
            <div style="margin-top: 10px;">
                <div>HP</div>
                <div class="stat-bar"><div class="stat-fill" id="hp-bar" style="width: 100%"></div></div>
                <div>Mana</div>
                <div class="stat-bar"><div class="stat-fill" id="mana-bar" style="width: 100%; background: linear-gradient(90deg, #2196f3, #4fc3f7)"></div></div>
            </div>
            <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
                <p>Pouvoirs:</p>
                <div id="powers-list" style="font-size: 12px;"></div>
            </div>
        </div>

        <!-- Shop -->
        <div class="shop" id="shop">
            <h3>⚔️ Boutique</h3>
            <div id="shop-items"></div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button onclick="toggleShop()">Boutique (B)</button>
            <button onclick="togglePowers()">Pouvoirs (P)</button>
            <button onclick="logout()">Quitter</button>
        </div>

        <!-- Message -->
        <div class="message" id="message"></div>
    </div>

    <script>
        // Game State
        let gameState = {
            username: '',
            email: '',
            level: 1,
            xp: 0,
            hp: 100,
            maxHp: 100,
            mana: 50,
            maxMana: 50,
            gold: 1000,
            powers: [],
            position: { x: 0, y: 5, z: 20 },
            hasUndergroundKey: false
        };

        // Three.js Variables
        let scene, camera, renderer;
        let player, terrain, trees = [], mobs = [], gods = [];
        let gameRunning = false;
        let keys = {};

        // Shop Items
        const SHOP_ITEMS = [
            { id: 1, name: 'Épée de Fer', price: 100, damage: 15 },
            { id: 2, name: 'Épée d\'Acier', price: 250, damage: 25 },
            { id: 3, name: 'Épée de Dragon', price: 500, damage: 50 },
            { id: 4, name: 'Potion de Vie', price: 50, heal: 30 },
            { id: 5, name: 'Potion de Mana', price: 50, mana: 30 }
        ];

        // Gods Data
        const GODS = [
            { name: 'Dieu du Feu', power: 'Inferno' },
            { name: 'Dieu de la Glace', power: 'Blizzard' },
            { name: 'Dieu de la Foudre', power: 'Électricité' },
            { name: 'Dieu de la Nature', power: 'Forêt' }
        ];

        // Login Function
        function login() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!username || !email || !password) {
                alert('Remplis tous les champs!');
                return;
            }

            gameState.username = username;
            gameState.email = email;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('player-name').textContent = username;

            initGame();
        }

        // Logout Function
        function logout() {
            location.reload();
        }

        // Initialize Three.js Game
        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 300, 500);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(100, 200, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Create World
            createTerrain();
            createPlayer();
            createTrees();
            createMobs();
            createUnderground();

            gameRunning = true;

            // Input Events
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === 'b') toggleShop();
                if (e.key === 'p') togglePowers();
                if (e.key === 'e') interact();
                if (e.key === ' ') player.position.y = 10;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            window.addEventListener('click', () => {
                attack();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            loadShopItems();
            animate();
        }

        // Create Terrain
        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(500, 500);
            const material = new THREE.MeshLambertMaterial({ color: 0x2d8659 });
            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        // Create Player
        function createPlayer() {
            const geometry = new THREE.BoxGeometry(2, 3, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            player = new THREE.Mesh(geometry, material);
            player.position.copy(gameState.position);
            player.castShadow = true;
            scene.add(player);
        }

        // Create Trees
        function createTrees() {
            for (let i = 0; i < 20; i++) {
                const tree = createTree(
                    (Math.random() - 0.5) * 500,
                    (Math.random() - 0.5) * 500
                );
                trees.push(tree);
                scene.add(tree);

                // First tree has key
                if (i === 0) {
                    tree.position.set(0, 0, 0);
                    tree.userData.hasKey = true;
                }
            }
        }

        function createTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(3, 4, 20, 8),
                new THREE.MeshLambertMaterial({ color: 0x654321 })
            );
            trunk.position.y = 10;
            trunk.castShadow = true;

            const foliage = new THREE.Mesh(
                new THREE.SphereGeometry(15, 8, 8),
                new THREE.MeshLambertMaterial({ color: 0x228b22 })
            );
            foliage.position.y = 30;
            foliage.castShadow = true;

            const tree = new THREE.Group();
            tree.add(trunk);
            tree.add(foliage);
            tree.position.set(x, 0, z);
            tree.userData.hasKey = false;
            return tree;
        }

        // Create Mobs
        function createMobs() {
            for (let i = 0; i < 15; i++) {
                const mobGeometry = new THREE.BoxGeometry(1.5, 2, 1);
                const mobMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b35 });
                const mob = new THREE.Mesh(mobGeometry, mobMaterial);

                mob.position.set(
                    (Math.random() - 0.5) * 400,
                    5,
                    (Math.random() - 0.5) * 400
                );
                mob.castShadow = true;
                mob.userData = {
                    health: 30,
                    maxHealth: 30,
                    level: Math.floor(Math.random() * 10) + 1
                };

                mobs.push(mob);
                scene.add(mob);
            }
        }

        // Create Underground
        function createUnderground() {
            const undergroundGeometry = new THREE.PlaneGeometry(500, 500);
            const undergroundMaterial = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
            const undergroundTerrain = new THREE.Mesh(undergroundGeometry, undergroundMaterial);
            undergroundTerrain.rotation.x = -Math.PI / 2;
            undergroundTerrain.position.y = -50;
            undergroundTerrain.receiveShadow = true;
            scene.add(undergroundTerrain);

            // Add Gods
            GODS.forEach((god, i) => {
                const godGeometry = new THREE.ConeGeometry(3, 8, 8);
                const colors = [0xff0000, 0x0000ff, 0xffff00, 0x00ff00];
                const godMaterial = new THREE.MeshLambertMaterial({ color: colors[i] });
                const godMesh = new THREE.Mesh(godGeometry, godMaterial);
                godMesh.position.set((i - 1.5) * 50, -45, 0);
                godMesh.castShadow = true;
                godMesh.userData = god;
                gods.push(godMesh);
                scene.add(godMesh);
            });
        }

        // Player Movement
        function updatePlayer() {
            const speed = 0.5;
            if (keys['w'] || keys['arrowup']) player.position.z -= speed;
            if (keys['s'] || keys['arrowdown']) player.position.z += speed;
            if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
            if (keys['d'] || keys['arrowright']) player.position.x += speed;

            // Bounds
            player.position.x = Math.max(-250, Math.min(250, player.position.x));
            player.position.z = Math.max(-250, Math.min(250, player.position.z));

            // Gravity
            if (player.position.y > 0) {
                player.position.y -= 0.1;
            }

            // Camera Follow
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 15;

            gameState.position = player.position;
        }

        // Attack Function
        function attack() {
            mobs.forEach(mob => {
                const distance = player.position.distanceTo(mob.position);
                if (distance < 10) {
                    mob.userData.health -= 10;
                    if (mob.userData.health <= 0) {
                        scene.remove(mob);
                        gameState.xp += 50;
                        gameState.gold += 100;
                        showMessage('🎯 Mob vaincu! +50 XP, +100 Or');
                        if (gameState.xp >= gameState.level * 100) {
                            gameState.level++;
                            gameState.xp = 0;
                            showMessage('⭐ Niveau augmenté!');
                        }
                        updateHUD();
                    }
                }
            });
        }

        // Interact Function
        function interact() {
            trees.forEach(tree => {
                const distance = player.position.distanceTo(tree.position);
                if (distance < 20 && tree.userData.hasKey) {
                    tree.userData.hasKey = false;
                    gameState.hasUndergroundKey = true;
                    showMessage('🔑 Clé souterraine trouvée!');
                    updateHUD();
                }
            });

            // Check underground access
            if (player.position.y < -40 && gameState.hasUndergroundKey) {
                showMessage('⛩️ Vous êtes entré au royaume souterrain!');
            }

            // Interact with gods
            gods.forEach(god => {
                const distance = player.position.distanceTo(god.position);
                if (distance < 20) {
                    if (!gameState.powers.includes(god.userData.power)) {
                        gameState.powers.push(god.userData.power);
                        showMessage(`⚡ Pouvoir acquis: ${god.userData.power}`);
                        updateHUD();
                    }
                }
            });
        }

        // Shop Functions
        function toggleShop() {
            document.getElementById('shop').classList.toggle('active');
        }

        function loadShopItems() {
            const shopItems = document.getElementById('shop-items');
            shopItems.innerHTML = SHOP_ITEMS.map(item => `
                <div class="shop-item" onclick="buyItem(${item.id})">
                    <strong>${item.name}</strong><br>
                    Prix: ${item.price} Or
                </div>
            `).join('');
        }

        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (gameState.gold >= item.price) {
                gameState.gold -= item.price;
                if (item.heal) gameState.hp = Math.min(gameState.maxHp, gameState.hp + item.heal);
                if (item.mana) gameState.mana = Math.min(gameState.maxMana, gameState.mana + item.mana);
                showMessage(`✅ ${item.name} acheté!`);
                updateHUD();
            } else {
                showMessage('❌ Pas assez d\'or!');
            }
        }

        // Powers Toggle
        function togglePowers() {
            const list = document.getElementById('powers-list');
            if (list.style.display === 'none') {
                list.style.display = 'block';
                list.innerHTML = gameState.powers.map(p => `<div>⚡ ${p}</div>`).join('');
            } else {
                list.style.display = 'none';
            }
        }

        // Show Message
        function showMessage(msg) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = msg;
            msgEl.classList.add('active');
            setTimeout(() => msgEl.classList.remove('active'), 3000);
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('xp').textContent = gameState.xp;
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('hp-bar').style.width = (gameState.hp / gameState.maxHp) * 100 + '%';
            document.getElementById('mana-bar').style.width = (gameState.mana / gameState.maxMana) * 100 + '%';
            document.getElementById('powers-list').innerHTML = gameState.powers.map(p => `<div>⚡ ${p}</div>`).join('');
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                updatePlayer();

                // Mob AI
                mobs.forEach(mob => {
                    if (mob.userData.health > 0) {
                        const direction = player.position.clone().sub(mob.position).normalize();
                        mob.position.addScaledVector(direction, 0.02);
                    }
                });
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
