<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #loginForm, #registerForm, #gameInterface, #shopPanel { margin: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        #gameCanvas { width: 100%; height: 400px; background: #eee; border: 1px solid #000; }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>Login</h2>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="registerForm">
        <h2>Register</h2>
        <form>
            <label for="newUsername">Create Username:</label>
            <input type="text" id="newUsername" required><br>
            <label for="newPassword">Create Password:</label>
            <input type="password" id="newPassword" required><br>
            <button type="submit">Register</button>
        </form>
    </div>

    <div id="gameInterface">
        <h2>Game Interface</h2>
        <canvas id="gameCanvas"></canvas>
        <div id="playerStats">
            <h3>Player Stats</h3>
            <p>Health: <span id="health">100</span></p>
            <p>Score: <span id="score">0</span></p>
        </div>
        <div id="controls">
            <h3>Controls</h3>
            <p>Use WASD to move</p>
            <p>Use Space to shoot</p>
        </div>
    </div>

    <div id="shopPanel">
        <h2>Weapon Shop</h2>
        <ul>
            <li>Sword - $100</li>
            <li>Bow - $150</li>
            <li>Magic Wand - $200</li>
        </ul>
        <button type="button">Buy Weapon</button>
    </div>
</body>
</html>
